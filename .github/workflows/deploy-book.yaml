name: deploy-book

# Build the book for every pull request (as a check) and on every push to main;
# deploy it to GitHub Pages only from main. The deploy can also be started by
# hand ("Run workflow" on the Actions tab).
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Only the packages to build the book. The notebooks are not executed
    # (execute_notebooks: "off" in _config.yml).
    - name: Install dependencies
      run: pip install -r requirements-book.txt

    - name: Build the book
      run: jupyter-book build .

    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v3
      with:
        path: "_build/html"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
